name: Deploy Afterglow New
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TRAIL_RELEASE: cloudridge-web-v1.1.0
      TRAIL_SHA256: de1c49926fdd9fcacdf7e9e7a863cd9ee898051432a4b6eebbfc6c37f813b3d5
      # Unity uses the document directory to locate the player's saves.
      TRAIL_ENTRY: cloudridge-web-v1.0.0
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worlds/okeeffe/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm test
      - name: Build for GitHub Pages
        run: npm run build -- --base "$PAGES_BASE/"
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
      - run: npm ci --prefix worlds/okeeffe
      - name: Build O’Keeffe’s entrance
        run: npm run build --prefix worlds/okeeffe -- --outDir ../../dist/okeeffe
        env:
          VITE_TRAIL_SCENE_URL: ./trail/${{ env.TRAIL_ENTRY }}/?v=${{ env.TRAIL_RELEASE }}
      - name: Include the Cloudridge Trail WebGL build
        run: |
          archive="$RUNNER_TEMP/cloudridge-web.tar.gz"
          destination="dist/okeeffe/trail/$TRAIL_RELEASE"
          curl --fail --location --retry 3 --output "$archive" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TRAIL_RELEASE/cloudridge-web.tar.gz"
          printf '%s  %s\n' "$TRAIL_SHA256" "$archive" | sha256sum --check
          mkdir -p "$destination"
          tar -xzf "$archive" -C "$destination"
          test -s "$destination/index.html"
          if [ "$TRAIL_ENTRY" != "$TRAIL_RELEASE" ]; then
            entry="dist/okeeffe/trail/$TRAIL_ENTRY"
            mkdir -p "$entry"
            sed "s|<head>|<head><base href=\"../$TRAIL_RELEASE/\">|" "$destination/index.html" > "$entry/index.html"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
